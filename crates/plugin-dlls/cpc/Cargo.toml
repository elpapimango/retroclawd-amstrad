[package]
name = "cpc-machine-plugin-dll"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared-library build of cpc-machine-plugin: only the C entry points, all logic lives in cpc-machine-plugin"

[lib]
name = "cpc_machine_plugin"
crate-type = ["cdylib"]

[dependencies]
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "39dfdcc276719bffd9da53ead351e0d3da14b1bb" }
cpc-machine-plugin = { path = "../../plugins/cpc-machine-plugin" }
