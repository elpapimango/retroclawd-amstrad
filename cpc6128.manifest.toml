machine = "cpc6128"
# Goldens are the whole ZEsarUX picture on retroclawd's canvas (capture_zesarux_screen.py --crop 0,-16,768,576: the same
# 2x scale and horizontal position, 16 rows lower in retroclawd, the border colour filling the gap), compared with
# retroclawd's picture. S4 (sound) and S7 (hardware test ROMs: the acid suites run in the hand-written suite) are not here
# yet. The CPC Plus and GX4000 are not in ZEsarUX, so they have no manifest.
args = ["--no-border"]

[reference]
emulator = "zesarux"
version = "13.0"
command = "retroclawd-tools/scripts/capture_zesarux_screen.py CPC6128 8 OUT.png --crop 0,-16,768,576 [--keys 'print 1234 mod 100{ENTER}' --after 2 | --load FILE --keys 'cat{ENTER}' --after 3]   (zesarux --machine CPC6128 --realvideo, save-screen over ZRCP)"

[files]
rom = "amstrad/roms/cpc/cpc6128.rom"

[[scenario]]
id = "S1"
kind = "screen"
frames = 250
golden = "cpc6128/S1-boot.png"
golden_sha256 = "62d34e5db1b67c33eb6aded2c84ce6016493a6833d2258c40d1d9810a59b6a5b"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.15, 0.95, 0.40], reason = "the cursor (it blinks) is outside the crop; another emulator's rasteriser; the crop is the banner and the Ready prompt (the pictures were compared pixel by pixel and are identical, the tolerance only absorbs scaling noise)" }

[[scenario]]
id = "S2"
kind = "screen"
frames = 700
args = ["--type-after", "200", "--type-delay", "100", "--type", "print 1234 mod 100\n"]
golden = "cpc6128/S2-mod.png"
golden_sha256 = "756658c04e1911e3a6a33b6fed30184706ca49e0398a67b67bf2e5879c788d05"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.15, 0.95, 0.465], reason = "the cursor (it blinks) is outside the crop; another emulator's rasteriser; the crop is the banner, the typed line and its answer 34" }

# The disk is made by rcld (scenarios/cpc/hello.asm, one file HELLO.BIN); CAT lists it. (RUN"HELLO is not used: it
# ends in a reset in both emulators, so it would only compare two resets.)
[[scenario]]
id = "S3-cat"
kind = "screen"
frames = 900
args = ["--type-after", "200", "--type-delay", "100", "--type", "cat\n"]
files = { disk = "amstrad/software/scenarios/cpc-hello.dsk" }
golden = "cpc6128/S3-cat.png"
golden_sha256 = "1edf36222c73157ffcc64c8e667c980d63e5cbc9b7fb9edb756b3800d4da0935"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.15, 0.95, 0.60], reason = "the cursor (it blinks) is outside the crop; another emulator's rasteriser; the crop is the CAT listing (drive, HELLO.BIN 1K, 177K free)" }

# S4: BASIC's SOUND 1,240,1000 plays a 10 s tone on AY channel A (period 240, a 1 MHz AY: 260.4 Hz). ZEsarUX 13.0 recorded
# 12-16 s: 260.02 Hz; retroclawd 260.40 Hz. Levels differ (0.0446 to 0.0685 at the reference, 0.096 to 0.120 here): a mixer choice, only "clearly audible" is required.
[[scenario]]
id = "S4"
kind = "audio"
frames = 1000
args = ["--type-after", "200", "--type-delay", "100", "--type", "sound 1,240,1000\n"]
audio = { from_s = 12.0, to_s = 16.0, tone_hz = 260.4, tone_tolerance_pct = 1.0, min_amplitude = 0.02 }

# S7: Lyle Llopis' amstrad-diagnostics v1.3 (MIT) from its disk: RUN"DIAG shows the menu after its lower RAM test. The reference
# is ZEsarUX 13.0 with the same disk, 28 s in. The picture is compared in two parts, the system info and the test results; the
# CRTC and FDC lines between them are a known gap (S7-hw), where the reference reports a CRTC type 4 and no FDC.
[[scenario]]
id = "S7"
kind = "screen"
frames = 1400
args = ["--type-after", "150", "--type-delay", "80", "--type", "RUN\"DIAG\n"]
files = { disk = "amstrad/software/diagnostics/AmstradDiag.dsk" }
golden = "cpc6128/S7-diag.png"
golden_sha256 = "2c8264807870c23c7a58c28877c34d463cb0a673f783722046fa07e572b5373d"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.12, 0.95, 0.375], reason = "another emulator's rasteriser; the crop is the title bar, the model, vendor, refresh rate and RAM size and the list of tests" }

[[scenario]]
id = "S7-results"
kind = "screen"
frames = 1400
args = ["--type-after", "150", "--type-delay", "80", "--type", "RUN\"DIAG\n"]
files = { disk = "amstrad/software/diagnostics/AmstradDiag.dsk" }
golden = "cpc6128/S7-diag.png"
golden_sha256 = "2c8264807870c23c7a58c28877c34d463cb0a673f783722046fa07e572b5373d"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.46, 0.95, 0.68], reason = "another emulator's rasteriser; the crop is the TEST RESULTS block: LOWER RAM PASSED, the others untested" }

[[scenario]]
id = "S7-hw"
kind = "screen"
frames = 1400
args = ["--type-after", "150", "--type-delay", "80", "--type", "RUN\"DIAG\n"]
files = { disk = "amstrad/software/diagnostics/AmstradDiag.dsk" }
golden = "cpc6128/S7-diag.png"
golden_sha256 = "2c8264807870c23c7a58c28877c34d463cb0a673f783722046fa07e572b5373d"
compare = { mode = "similarity", max_mad = 1.0, crop = [0.05, 0.385, 0.95, 0.44], reason = "another emulator's rasteriser; the crop is the CRTC and FDC lines" }
status = "known-gap"
gap = { reason = "the diagnostics read the CRTC type and probe the FDC: ZEsarUX answers CRTC 04 (the ASIC's type) and FDC NONE on a CPC6128 with a disk in the drive, retroclawd CRTC 01 and FDC DETECTED; the reference looks wrong on both, but nothing here shows which CRTC type the real machine had", evidence = "machines/amstrad/docs/cpc-diag-crtc-fdc-gap.md" }

[[scenario]]
id = "S5"
kind = "state"
frames = 700
more_frames = 100
args = ["--type-after", "200", "--type-delay", "100", "--type", "print 1234 mod 100\n"]

# ZEsarUX's frame is 79872 T-states (312 lines of 256, measured as 6 interrupts of 13312), the CRTC frame the firmware
# programs; closed 2026-10-19 (docs/cpc-timing-gap.md).
[[scenario]]
id = "S6"
kind = "timing"
frames = 100
cycles_per_frame = 79872
cycles_tolerance = 23
